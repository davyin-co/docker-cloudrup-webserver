name: Docker Image CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      name:
        description: 'Reason'
        required: true
        default: 'blabla...'
      target:
        description: 'Build target (all = PHP 7.4, 8.0–8.3 without OCI8; php74-security = 7.4 CVE test only)'
        type: choice
        options:
          - all
          - php74-security
        default: all

jobs:
  php74-security:
    # Validate the emergency image on every PR, including draft PRs.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target == 'php74-security')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Build patched PHP 7.4 image
      run: >-
        docker build --pull --no-cache --platform linux/amd64
        -f security/php74/Dockerfile
        -t cloudrup-webserver:7.4-cve-ci .
    - name: Verify PHP packages and CLI behavior
      run: >-
        docker run --rm --platform linux/amd64 --entrypoint sh
        cloudrup-webserver:7.4-cve-ci /usr/local/bin/verify-php74-cve
    - name: Verify Apache and upload behavior
      run: python3 security/php74/test-http.py cloudrup-webserver:7.4-cve-ci

  build:
    # Publish only PHP 7.4 and 8.0–8.3; OCI8 variants are excluded.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'all')
    runs-on: ubuntu-latest
    strategy:
      matrix:
       include:
         - tag: 7.4
           Dockerfile: "7.4/Dockerfile"
           image: "davyinsa/cloudrup-webserver:7.4"
         - tag: 8.0
           Dockerfile: "8.0/Dockerfile"
           image: "davyinsa/cloudrup-webserver:8.0"
         - tag: 8.1
           Dockerfile: "8.1/Dockerfile"
           image: "davyinsa/cloudrup-webserver:8.1"
         - tag: 8.2
           Dockerfile: "8.2/Dockerfile"
           image: "davyinsa/cloudrup-webserver:8.2"
         - tag: 8.3
           Dockerfile: "8.3/Dockerfile"
           image: "davyinsa/cloudrup-webserver:8.3"
    steps:
    - uses: actions/checkout@v4
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    -
      # Build once, load into the docker store. Aliyun ACR rejects the OCI
      # empty manifest (application/vnd.oci.empty.v1+json) that the buildx
      # registry exporter produces, so both registries are pushed with the
      # classic `docker push`, which uses Docker v2 schema 2 manifests.
      name: Build image
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        load: true
        context: .
        # Only amd64 is verified; do not publish unverified arm64 images.
        platforms: linux/amd64
        file: ${{ matrix.Dockerfile }}
        tags: ${{ matrix.image }}
    -
      name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    -
      name: Push to DockerHub
      if: github.event_name != 'pull_request'
      run: docker push ${{ matrix.image }}
    -
      name: Login to Aliyun CS
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: registry.cn-hangzhou.aliyuncs.com
        username: ${{ secrets.ALIYUNCR_USERNAME }}
        password: ${{ secrets.ALIYUNCR_PASSWORD }}
    -
      name: Push to ALIYUN CR
      if: github.event_name != 'pull_request'
      run: |-
        docker tag ${{ matrix.image }} registry.cn-hangzhou.aliyuncs.com/davyin/cloudrup-webserver:${{ matrix.tag }}
        docker push registry.cn-hangzhou.aliyuncs.com/davyin/cloudrup-webserver:${{ matrix.tag }}
